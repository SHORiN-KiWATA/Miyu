# 编译并行度按住 3 个核心(09-11 用户裁定)。
#
# 限的是同时跑几个 rustc 进程——依赖那几百个 crate 的编译是唯一真正吃满
# 16 核的阶段,这里按住的就是它。Miyu 自己是一个大 crate,前端(解析/类型
# 检查/借用检查)本来就基本单线程,实测平均只占 1.85 核(user/real),不受
# 这个值影响。
#
# 单个 rustc 内部的 codegen 线程不归 jobs 管,所以峰值偶尔会冒过 3 核;
# 要内核层面焊死就在外面套
# `systemd-run --user --scope -p CPUQuota=300% cargo build`。
[build]
jobs = 3
