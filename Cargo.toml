[package]
name = "miyu"
version = "0.4.6"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/SHORiN-KiWATA/Miyu"
description = "Command-line AI assistant"
autobins = false

[lib]
name = "miyu"
path = "src/lib.rs"

[[bin]]
name = "miyu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1.5"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
crc32fast = "1.4"
crossterm = "0.28"
directories = "5.0"
hex = "0.4"
html2text = "0.16.7"
htmd = "0.5.5"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
json_comments = "0.2"
markup5ever_rcdom = "0.38"
futures-util = "0.3"
flate2 = "1.0"
fuzzy-matcher = "0.3"
fancy-regex = "0.17"
fst = "0.4"
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
if-addrs = "0.13"
libc = "0.2"
md5 = "0.7"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream", "gzip", "deflate"] }
rand = "0.8"
rpassword = "7.4"
rodio = { version = "0.19", default-features = false, features = ["mp3", "wav"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
termimad = "0.34"
tempfile = "3.15"
tar = "0.4"
tokio = { version = "1.38", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
trash = "5.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
urlencoding = "2.1"
vte = "0.15"
rustc-hash = "2"
yaml-rust2 = { version = "0.11", default-features = false }
ratex-parser = "0.1.12"
ratex-layout = "0.1.12"
ratex-types = "0.1.12"
ratex-render = { version = "0.1.12", features = ["embed-fonts"] }

[build-dependencies]
base64 = "0.22"
fst = "0.4"

[dev-dependencies]
jieba-rs = "0.7"
tiktoken-rs = "0.12"

[profile.release]
lto = "thin"
strip = "symbols"
# 单编译单元：跨单元内联与去重充分化，.text 实测显著缩小（见
# docs/plan/low-footprint.md 第 3 轮）。代价只是 release 编译更慢。
codegen-units = 1
